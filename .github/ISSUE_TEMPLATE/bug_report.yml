name: Bug report
description: Report incorrect skill behavior, documentation, validation, or portability problems.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include sensitive personal information, private conversations, credentials, or medical records.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the issue using synthetic or minimally identifying information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill behavior
        - Safety
        - Privacy
        - Research/evidence
        - Validation tooling
        - Compatibility
        - Documentation
    validations:
      required: true
